<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@600;700;800;900&family=Archivo+Black&family=DM+Serif+Display&family=Space+Grotesk:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#14463f;font-family:Inter,sans-serif}
#world{position:absolute;inset:0}.shot{position:absolute;inset:0;overflow:hidden}.abs{position:absolute}
.big{font-family:Inter,sans-serif;font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:-.02em;white-space:nowrap}
.serif{font-family:Fraunces,Georgia,serif;font-weight:800;letter-spacing:-.02em;line-height:1}
.dm{font-family:'DM Serif Display',serif;line-height:1}.arch{font-family:'Archivo Black',sans-serif;text-transform:uppercase;line-height:.92;white-space:nowrap}
.bebas{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;line-height:.9;white-space:nowrap}.grot{font-family:'Space Grotesk',sans-serif;font-weight:700}
.ch{display:inline-block;will-change:transform}
#flash{position:absolute;inset:0;background:#fff7e6;opacity:0;pointer-events:none;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 55%,rgba(6,22,19,.38) 100%)}
#grain{position:absolute;inset:-40px;pointer-events:none;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
<div id="stage"><div id="world"></div><div id="vig"></div><div id="flash"></div><div id="grain"></div></div>
<script src="lib.js"></script>
<script>
const id=new URLSearchParams(location.search).get('t');
const s=document.createElement('script');s.src='../templates/'+id+'.js';s.onload=()=>{document.getElementById('world').style.filter=window.REEL.grade||'contrast(1.06) saturate(1.08)';window.REEL.build();window.__ready=true};document.head.appendChild(s);
</script>
